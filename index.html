<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour Medellín Real</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: url('https://images.unsplash.com/photo-1505761671935-60b3a7427bad') no-repeat center/cover;
  color: #fff;
}

.overlay {
  background: rgba(0,0,0,0.75);
  min-height: 100vh;
  padding: 30px;
}

.flyer {
  max-width: 900px;
  margin: auto;
  background: rgba(20,20,20,0.9);
  padding: 30px;
  border-radius: 20px;
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(30px);}
  to {opacity: 1; transform: translateY(0);}
}

.title {
  font-size: 36px;
  text-align: center;
  color: #f5c542;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 20px;
}

.card {
  background: #1a1a1a;
  padding: 15px;
  border-radius: 12px;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(245,197,66,0.4);
}

.video-card {
  margin-top: 20px;
  border-radius: 15px;
  overflow: hidden;
  position: relative;
}

.video-controls {
  position: absolute;
  bottom: 10px;
  left: 10px;
}

button {
  background: #f5c542;
  border: none;
  padding: 8px;
  margin-right: 5px;
  cursor: pointer;
}

.map {
  margin-top: 20px;
  border-radius: 15px;
  overflow: hidden;
}

.qr {
  text-align: center;
  margin-top: 20px;
}

.qr img {
  width: 130px;
}

.float-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25D366;
  color: #fff;
  padding: 15px 20px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: bold;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% {transform: scale(1);}
  50% {transform: scale(1.1);}
  100% {transform: scale(1);}
}

@media(max-width:600px){
  .grid {grid-template-columns: 1fr;}
}
</style>
</head>

<body>

<div class="overlay">
<div class="flyer">

<!-- 🔴 CAMBIAR NOMBRE DEL TOUR -->
<div class="title">Tour Medellín Real</div>

<div class="grid">

<!-- 🔴 CAMBIA LOS DATOS AQUÍ -->
<div class="card"><strong>Guía:</strong><br>Juan Pérez (Ejemplo)</div>
<div class="card"><strong>Duración:</strong><br>2h 30min</div>
<div class="card"><strong>Tipo:</strong><br>Caminata guiada</div>
<div class="card"><strong>Dificultad:</strong><br>Baja</div>
<div class="card"><strong>Idioma:</strong><br>Español / Inglés</div>
<div class="card"><strong>Hora:</strong><br>2:00 p.m.</div>

</div>

<!-- 🎥 VIDEO FUNCIONAL -->
<div class="video-card">
  <video id="videoTour" width="100%">
    
    <!-- 🔴 CAMBIAR VIDEO AQUÍ -->
    <!-- OPCIÓN 1: Video local -->
    <!-- <source src="mi-video.mp4" type="video/mp4"> -->

    <!-- OPCIÓN 2: Video online (este funciona) -->
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">

  </video>

  <div class="video-controls">
    <button onclick="playVideo()">▶</button>
    <button onclick="pauseVideo()">⏸</button>
    <button onclick="stopVideo()">✖</button>
  </div>
</div>

<!-- 📍 MAPA -->
<div class="map">
  <iframe 
    src="https://www.google.com/maps?q=Plaza+Botero+Medellin&output=embed"
    width="100%" height="250" style="border:0;">
  </iframe>
</div>

<!-- 📲 QR -->
<div class="qr">
  <p>Escanea para reservar</p>

  <!-- 🔴 CAMBIAR LINK DEL QR -->
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://wa.me/573000000000">
</div>

</div>
</div>

<!-- 💬 BOTÓN WHATSAPP -->
<a class="float-btn" href="https://wa.me/573000000000" target="_blank">
  Reservar ahora
</a>

<script>
let video = document.getElementById("videoTour");

function playVideo(){
  video.play();
}

function pauseVideo(){
  video.pause();
}

function stopVideo(){
  video.pause();
  video.currentTime = 0;
}
</script>

</body>
</html>
