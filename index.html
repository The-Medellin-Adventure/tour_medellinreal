<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour Medellín Real</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins', sans-serif;
  background:url('plaza/fondo.jpg') center/cover no-repeat;
  color:#fff;
}

.overlay{
  background:rgba(0,0,0,0.75);
  min-height:100vh;
  padding:20px;
}

.header{
  text-align:center;
  position:relative;
}

.logo{
  width:160px;
}

.title{
  font-size:55px;
  font-weight:700;
  color:#f5c542;
}

.subtitle{
  font-size:18px;
  opacity:.8;
}

.price{
  position:absolute;
  top:10px;
  right:10px;
  background:linear-gradient(145deg,#ffd700,#caa300);
  color:#000;
  padding:15px 20px;
  border-radius:50px;
  font-size:20px;
  font-weight:bold;
}

.section{
  margin:15px 0;
}

.section button{
  width:100%;
  padding:15px;
  background:rgba(255,255,255,0.08);
  border:none;
  color:#fff;
  font-size:16px;
  border-radius:12px;
  cursor:pointer;
  text-align:left;
}

.section button:hover{
  background:#f5c542;
  color:#000;
}

.content{
  display:none;
  padding:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
}

.grid img{
  width:100%;
  border-radius:10px;
  cursor:pointer;
  transition:.3s;
}

.grid img:hover{
  transform:scale(1.05);
}

.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

.modal img{
  max-width:80%;
  border-radius:10px;
}

.video-float{
  position:fixed;
  right:20px;
  bottom:20px;
  width:260px;
  background:#000;
  border-radius:15px;
  overflow:hidden;
}

.video-header{
  background:#f5c542;
  color:#000;
  text-align:center;
  padding:5px;
}

.map{
  margin-top:10px;
  border-radius:10px;
  overflow:hidden;
}

.footer{
  margin-top:30px;
  text-align:center;
}

.footer a{
  color:#f5c542;
  margin:5px;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="overlay">

<div class="header">

<!-- 🔴 LOGO -->
<img src="plaza/logo.png" class="logo">

<div class="price">$89K</div>

<div class="title">Tour Medellín Real</div>
<div class="subtitle">Descubre la ciudad verdadera</div>

</div>

<!-- INFO -->
<div class="section">
<button onclick="toggle(this)">📍 Información del Tour</button>
<div class="content">
<p>Caminata guiada por el centro histórico de Medellín.</p>
</div>
</div>

<!-- PARADAS -->
<div class="section">
<button onclick="toggle(this)">📸 Paradas del recorrido</button>
<div class="content">
<div class="grid">

<img src="plaza/plaza.jpg" onclick="openModal(this.src)">
<img src="plaza/cultura.jpg" onclick="openModal(this.src)">
<img src="plaza/nacional.jpg" onclick="openModal(this.src)">
<img src="plaza/luces.jpg" onclick="openModal(this.src)">

</div>
</div>
</div>

<!-- MAPA -->
<div class="section">
<button onclick="toggle(this)">🗺 Punto de encuentro</button>
<div class="content">
<div class="map">
<iframe src="https://www.google.com/maps?q=Plaza+Botero+Medellin&output=embed" width="100%" height="200"></iframe>
</div>
</div>
</div>

<!-- BOTÓN -->
<div style="text-align:center; margin-top:20px;">
<a href="https://wa.me/573000000000" style="background:#25D366;padding:15px 25px;border-radius:10px;color:#fff;text-decoration:none;font-weight:bold;">
Reservar ahora
</a>
</div>

<!-- FOOTER -->
<div class="footer">
<a href="#">Instagram</a>
<a href="#">TikTok</a>
<a href="#">YouTube</a>
<a href="#">Página Web</a>
<p>📞 +57 300 000 0000</p>
<p>✉ correo@empresa.com</p>
</div>

</div>

<!-- VIDEO -->
<div class="video-float">
<div class="video-header">Guía te explica</div>
<video id="video" width="100%">
<source src="https://www.w3schools.com/html/mov_bbb.mp4">
</video>
<div style="text-align:center;">
<button onclick="video.play()">▶</button>
<button onclick="video.pause()">⏸</button>
</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="this.style.display='none'">
<img id="modalImg">
</div>

<script>
function toggle(btn){
  let content = btn.nextElementSibling;
  content.style.display = content.style.display === "block" ? "none" : "block";
}

function openModal(src){
  document.getElementById("modal").style.display="flex";
  document.getElementById("modalImg").src=src;
}
</script>

</body>
</html>
